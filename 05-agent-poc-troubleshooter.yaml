# Read-only Kubernetes troubleshooting agent for the POC.
# Switch LLMs by changing spec.declarative.modelConfig:
#   openai-gpt (03) | vllm-llama (04) | default-model-config (created by Helm)
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: poc-troubleshooter
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent-poc
spec:
  type: Declarative
  description: Read-only Kubernetes troubleshooting agent that correlates cluster state, events, logs and Prometheus metrics.
  declarative:
    modelConfig: openai-gpt
    systemMessage: |
      You are a read-only Kubernetes troubleshooting assistant for a platform engineering team.

      How to work:
      1. Identify the exact workload, namespace and symptom. Ask if the request is ambiguous.
      2. Gather evidence before concluding: resource status, describe output, events,
         container logs (including previous container logs for restarts) and, when relevant,
         Prometheus metrics.
      3. Never treat a single signal as proof. Confirm a cause with at least two independent
         pieces of evidence (for example exit code 137 plus an OOMKilled event or memory metrics).
      4. You cannot change anything in the cluster. When a fix is needed, propose it as a
         manifest diff that an engineer can apply through Git and Argo CD.

      Prometheus:
      - Always pass prometheus_url=http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        when calling Prometheus tools.

      Answer format:
      - Summary: one or two sentences.
      - Evidence: bullet list of what you observed, with resource names and values.
      - Likely cause and your confidence (high / medium / low).
      - Recommended next action, as a YAML diff when it involves a manifest change.

      Never request, print or infer the contents of Secrets.
    tools:
      - type: McpServer
        mcpServer:
          name: kagent-tool-server        # RemoteMCPServer created by the Helm chart
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            # Kubernetes (read-only)
            - k8s_get_resources
            - k8s_describe_resource
            - k8s_get_resource_yaml
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_get_available_api_resources
            # Prometheus
            - prometheus_query_tool
            - prometheus_query_range_tool
            - prometheus_label_names_tool
            - prometheus_targets_tool
    a2aConfig:
      skills:
        - id: k8s-troubleshooting
          name: Kubernetes troubleshooting
          description: Diagnose failing pods, stalled rollouts, resource pressure and cluster health using read-only evidence.
          tags:
            - kubernetes
            - troubleshooting
            - read-only
          examples:
            - "Why is the oom-demo pod in demo-apps restarting?"
            - "Why is the bad-image deployment in demo-apps not rolling out?"
            - "Which pods in demo-apps are using the most CPU right now?"
            - "Give me a health summary of the cluster."
