# LLM API key for the external provider (Option A).
#
# Preferred: create it from your shell so the key never lands in a file or in Git:
#   kubectl create secret generic kagent-openai -n kagent \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY"
#
# If you must apply it as YAML, replace the placeholder locally and do NOT commit it.
# For production, source this Secret from Vault / External Secrets / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: kagent-openai
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kagent-poc
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_WITH_YOUR_KEY"
